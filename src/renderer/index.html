<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'"
    />
    <title>WorkBuddy 双版本共存管理器</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">WB</span>
        <div>
          <h1>WorkBuddy 双版本共存管理器</h1>
          <p class="subtitle">国内版 WorkBuddy 与 WorkBuddy AI 国际版</p>
        </div>
      </div>
      <div class="meta">
        <button
          id="sponsor-link"
          class="sponsor-link"
          type="button"
          data-testid="sponsor-link"
          aria-label="API赞助商：memefast.cc（在系统默认浏览器中打开 https://memefast.cc/）"
        >API赞助商：memefast.cc</button>
        <span id="app-version" class="muted"></span>
      </div>
    </header>

    <main>
      <section class="toolbar">
        <div class="toolbar-left">
          <button id="btn-scan" class="btn btn-primary" type="button">重新扫描</button>
          <button id="btn-add-root" class="btn btn-ghost" type="button">补充扫描目录</button>
          <button id="btn-diagnostics" class="btn btn-ghost" type="button">诊断</button>
        </div>
        <span id="scan-time" class="muted"></span>
      </section>

      <div id="progress" class="progress" hidden>
        <span id="progress-phase" class="progress-phase"></span>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <span id="progress-percent" class="muted"></span>
      </div>

      <section id="products" class="products"></section>

      <section id="result" class="card" hidden></section>
    </main>

    <div id="modal" class="modal" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title"></h2>
        <div id="modal-body" class="modal-body"></div>
        <div class="modal-actions">
          <button id="modal-cancel" class="btn" type="button">取消</button>
          <button id="modal-confirm" class="btn btn-primary" type="button">确认</button>
        </div>
      </div>
    </div>

    <div id="diag" class="modal" hidden>
      <div class="modal-panel modal-wide" role="dialog" aria-modal="true" aria-labelledby="diag-title">
        <div class="card-head">
          <div>
            <h2 id="diag-title">诊断</h2>
            <p class="muted">检测线索是扫描证据，不等于安装份数；只读信息，用于排障。</p>
          </div>
          <button id="btn-export" class="btn btn-ghost" type="button">导出脱敏诊断</button>
        </div>
        <div id="diag-summary" class="list"></div>
        <div id="sources" class="chips"></div>
        <details class="details">
          <summary>影响检测的跳过项 <span id="skipped-count" class="muted"></span></summary>
          <div id="skipped" class="list"></div>
        </details>
        <details class="details">
          <summary>其他候选（未计入安装） <span id="candidates-count" class="muted"></span></summary>
          <div id="candidates" class="list"></div>
        </details>
        <details class="details">
          <summary>补充扫描目录 <span id="roots-count" class="muted"></span></summary>
          <div id="roots" class="list"></div>
        </details>
        <div class="modal-actions">
          <button id="diag-close" class="btn" type="button">关闭</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
    <script src="./renderer.js"></script>
  </body>
</html>
